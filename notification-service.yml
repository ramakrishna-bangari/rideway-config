server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: notification-service

  datasource:
    url: "${NOTIFICATION_DB_URL:jdbc:postgresql://ep-noisy-dew-b5w39h2p-pooler.c-7.us-east-2.aws.neon.tech/notification-service?sslmode=require&channel_binding=require}"
    username: ${NOTIFICATION_DB_USERNAME:neondb_owner}
    password: ${NOTIFICATION_DB_PASSWORD:npg_5r4XxHIqJaWi}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-rideway-ramakrishnabangari08-ec41.d.aivencloud.com:12097}

    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="avnadmin" password="AVNS_W7ymIBYCqcMxjvplAz3";'
      ssl.endpoint.identification.algorithm: https

    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

  endpoints:
    web:
      exposure:
        include: health,info

app:
  kafka:
    topics:
      notification-events: notification-events

  security:
    jwt:
      secret: ${JWT_SECRET:Jr7qK2mV9xL4pN8wT5aB3cD6eF0gH1iJkLmNoPqRsTu=}
