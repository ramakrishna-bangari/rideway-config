server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: dispatch-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DISPATCH_DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DISPATCH_DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DISPATCH_DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      url: ${DISPATCH_REDIS_URL}
      timeout: 5s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";'
      ssl.endpoint.identification.algorithm: https
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:/etc/secrets/ca.pem}

    consumer:
      group-id: dispatch-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.rideway.dispatch_service.dto.event"
        spring.json.value.default.type: com.rideway.dispatch_service.dto.event.RideDomainEvent
        spring.json.use.type.headers: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.add.type.headers: false

    listener:
      ack-mode: record

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  dispatch:
    search-radius-km: 5
    offer-timeout-seconds: ${OFFER_TIMEOUT_SECONDS:60}
    max-offers-per-ride: 5
    timeout-scan-ms: 5000
    location-freshness-seconds: 45
    location-key: rideway:dispatch:drivers:locations

  kafka:
    topics:
      ride-events: ride-events
      notification-events: notification-events

  services:
    ride:
      base-url: ${RIDE_SERVICE_URL:http://ride-service}
      internal-service-token: ${INTERNAL_SERVICE_TOKEN}
    identity:
      base-url: ${IDENTITY_SERVICE_URL:http://identity-service}
      internal-service-token: ${INTERNAL_SERVICE_TOKEN}
    notification:
      base-url: ${NOTIFICATION_SERVICE_URL:http://notification-service}

  security:
    jwt:
      secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
