server:
  port: ${PORT:${SERVER_PORT:8082}}

spring:
  application:
    name: ride-service

  datasource:
    url: ${RIDE_DB_URL}
    username: ${RIDE_DB_USERNAME}
    password: ${RIDE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";'
      ssl.endpoint.identification.algorithm: https
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:/etc/secrets/ca.pem}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  kafka:
    topics:
      ride-events: ${RIDE_EVENTS_TOPIC:ride-events}
  services:
    dispatch:
      base-url: ${DISPATCH_SERVICE_URL:http://localhost:8089}
  security:
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}

security:
  jwt:
    secret: ${JWT_SECRET}

rideway:
  routing:
    osrm-base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
  fare:
    rate-per-km: ${RIDEWAY_RATE_PER_KM:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
