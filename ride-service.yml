server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ride-service

  datasource:
    url: "${RIDE_DB_URL:jdbc:postgresql://ep-noisy-dew-b5w39h2p-pooler.c-7.us-east-2.aws.neon.tech/ride-service?sslmode=require&channel_binding=require}"
    username: ${RIDE_DB_USERNAME:neondb_owner}
    password: ${RIDE_DB_PASSWORD:npg_5r4XxHIqJaWi}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

app:
  kafka:
    topics:
      ride-events: ride-events

security:
  jwt:
    secret: ${JWT_SECRET:Jr7qK2mV9xL4pN8wT5aB3cD6eF0gH1iJkLmNoPqRsTu=}

rideway:
  routing:
    osrm-base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}

  fare:
    rate-per-km: ${RIDEWAY_RATE_PER_KM:15}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

  endpoints:
    web:
      exposure:
        include: health,info
