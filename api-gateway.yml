server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**,/api/riders/**,/api/drivers/**,/api/admin/**
            - id: ride-service
              uri: lb://ride-service
              predicates:
                - Path=/api/rides/**,/api/fares/**
            - id: dispatch-service
              uri: lb://dispatch-service
              predicates:
                - Path=/api/dispatch/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
    
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
