server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**,/api/riders/**,/api/drivers/**,/api/admin/**
            - id: ride-service
              uri: lb://ride-service
              predicates:
                - Path=/api/rides/**,/api/fares/**
            - id: dispatch-service
              uri: lb://dispatch-service
              predicates:
                - Path=/api/dispatch/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**,/ws-notifications/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://rideway-eureka-server:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
